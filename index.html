<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repertuar – Kino Za Rogiem</title>
<style>
:root{
  --green:#079b39;
  --green-dark:#056b2a;
  --green-soft:#eaf7ef;
  --red:#e73139;
  --orange:#f28c00;
  --blue:#1e88e5;
  --ink:#172018;
  --muted:#657068;
  --line:#dfe7e1;
  --card:#fff;
  --bg:#f4f7f4;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;height:auto;min-height:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 4% 5%,rgba(7,155,57,.10),transparent 31rem),
    radial-gradient(circle at 96% 8%,rgba(231,49,57,.08),transparent 29rem),
    var(--bg);
}

.page{
  width:min(1180px,100%);
  margin:0 auto;
  padding:18px 16px 26px;
}

.hero{
  position:relative;
  overflow:hidden;
  padding:22px 26px;
  border-radius:24px;
  color:#fff;
  background:linear-gradient(135deg,var(--green),var(--green-dark));
  box-shadow:0 14px 34px rgba(12,54,28,.16);
}
.hero::after{
  content:"";
  position:absolute;
  width:210px;height:210px;
  right:-72px;top:-95px;
  border-radius:50%;
  background:rgba(255,255,255,.12);
}
.kicker{
  position:relative;z-index:1;
  display:inline-flex;
  padding:6px 11px;
  border-radius:999px;
  background:rgba(255,255,255,.16);
  font-size:12px;font-weight:800;
  letter-spacing:.04em;text-transform:uppercase;
}
.hero h1{
  position:relative;z-index:1;
  margin:12px 0 5px;
  font-size:clamp(28px,4.5vw,48px);
  line-height:1.04;
}
.hero p{
  position:relative;z-index:1;
  margin:0;
  font-size:15px;
  opacity:.93;
}
.color-strip{
  position:relative;z-index:1;
  height:7px;
  margin-top:17px;
  border-radius:999px;
  background:linear-gradient(90deg,var(--red),var(--orange),#e4df00,#86c947,var(--green));
}

#app{height:auto;min-height:0}
.day{margin-top:24px}
.day-title{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  margin:0 0 11px;
  font-size:20px;
}
.date-pill{
  display:inline-flex;
  padding:7px 12px;
  border:1px solid rgba(7,155,57,.35);
  border-radius:999px;
  color:var(--green);
  background:#fff;
  font-size:14px;
  font-weight:900;
  box-shadow:0 6px 18px rgba(0,0,0,.05);
}
.day-name{font-weight:850}

.cards{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
  align-items:stretch;
}
.card{
  position:relative;
  display:grid;
  grid-template-columns:148px minmax(0,1fr);
  gap:18px;
  min-height:242px;
  padding:16px;
  border:1px solid rgba(20,55,30,.08);
  border-radius:22px;
  background:var(--card);
  box-shadow:0 12px 30px rgba(18,48,27,.09);
  overflow:hidden;
  transition:transform .18s ease,box-shadow .18s ease;
}
.card:hover{
  transform:translateY(-2px);
  box-shadow:0 17px 36px rgba(18,48,27,.13);
}
.card.dkf{border-color:rgba(30,136,229,.38)}

.poster{
  min-height:210px;
  border-radius:16px;
  overflow:hidden;
  background:#e5ebe6;
  box-shadow:0 8px 20px rgba(0,0,0,.17);
}
.poster img{
  display:block;
  width:100%;height:100%;
  object-fit:cover;
}
.poster-missing{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:210px;
  height:100%;
  padding:15px;
  text-align:center;
  color:var(--muted);
  font-weight:800;
}

.content{min-width:0}
.badges{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:10px;
}
.badge{
  display:inline-flex;
  align-items:center;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
}
.time{background:var(--green-soft);color:var(--green)}
.dkf-badge{background:var(--blue);color:#fff}
.ticket{background:#263238;color:#fff}
.age{background:var(--orange);color:#fff}
.age-family{background:var(--green)}
.age-young{background:#39a06a}
.age-teen{background:#b58b00}
.age-older{background:#ef7900}
.age-adult{background:#d82128}

h3{
  margin:0 0 7px;
  font-size:23px;
  line-height:1.12;
}
.meta{
  margin-bottom:11px;
  color:var(--muted);
  font-size:13px;
  font-weight:750;
  line-height:1.35;
}
.info{
  display:grid;
  gap:4px;
  font-size:13px;
  line-height:1.34;
}
.info p{margin:0}
.info strong{color:var(--green)}

.loading,.error{
  margin-top:24px;
  padding:20px;
  border-radius:18px;
  background:#fff;
  box-shadow:0 9px 24px rgba(0,0,0,.06);
  color:var(--muted);
  font-weight:750;
}

@media(max-width:900px){
  .cards{grid-template-columns:1fr}
}
@media(max-width:620px){
  .page{padding:10px 9px 18px}
  .hero{padding:19px 17px;border-radius:19px}
  .card{
    grid-template-columns:108px minmax(0,1fr);
    gap:13px;
    min-height:190px;
    padding:12px;
    border-radius:18px;
  }
  .poster,.poster-missing{min-height:164px}
  h3{font-size:19px}
  .meta,.info{font-size:12px}
  .badge{font-size:11px;padding:5px 8px}
}
@media(max-width:420px){
  .card{grid-template-columns:1fr}
  .poster{height:390px}
  .poster-missing{height:390px}
}
</style>
</head>
<body>
<div class="page" id="repertoire-page">
  <header class="hero">
    <div class="kicker">Kino Za Rogiem · MOKSiAL</div>
    <h1 id="title">Repertuar</h1>
    <p>Aktualny repertuar Kina Za Rogiem w Szklarskiej Porębie.</p>
    <div class="color-strip" aria-hidden="true"></div>
  </header>

  <main id="app">
    <div class="loading">Ładowanie repertuaru…</div>
  </main>
</div>

<script>
const DATA_FILE = "data/2026-07.json";

fetch(DATA_FILE)
  .then(response => {
    if(!response.ok) throw new Error("Nie udało się pobrać pliku repertuaru.");
    return response.json();
  })
  .then(data => {
    document.getElementById("title").textContent = `Repertuar — ${data.month}`;
    renderMovies(data.movies || []);
    requestAnimationFrame(reportHeight);
  })
  .catch(error => {
    document.getElementById("app").innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
    reportHeight();
  });

function renderMovies(movies){
  const app = document.getElementById("app");
  app.innerHTML = "";

  const groups = movies.reduce((result,movie) => {
    (result[movie.date] ||= []).push(movie);
    return result;
  },{});

  Object.entries(groups).forEach(([date,dayMovies]) => {
    const section = document.createElement("section");
    section.className = "day";
    section.innerHTML = `
      <h2 class="day-title">
        <span class="date-pill">${escapeHtml(date)}</span>
        <span class="day-name">${escapeHtml(dayName(date))}</span>
      </h2>
      <div class="cards"></div>`;

    const cards = section.querySelector(".cards");
    dayMovies.forEach(movie => cards.appendChild(createCard(movie)));
    app.appendChild(section);
  });
}

function createCard(movie){
  const card = document.createElement("article");
  card.className = `card${movie.dkf ? " dkf" : ""}`;

  const ageBadge = movie.age && movie.age !== "—"
    ? `<span class="badge age ${ageClass(movie.age)}">Wiek: ${formatAge(movie.age)}</span>`
    : "";

  const meta = [
    movie.genre,
    movie.country && movie.country !== "—" ? movie.country : "",
    movie.duration !== "—" && movie.duration != null ? `${movie.duration} min` : ""
  ].filter(Boolean).map(escapeHtml).join(" · ");

  card.innerHTML = `
    <div class="poster">
      <img src="posters/${encodeURIComponent(movie.poster)}" alt="${escapeHtml(movie.title)}" onerror="showMissingPoster(this)">
    </div>
    <div class="content">
      <div class="badges">
        <span class="badge time">godz. ${escapeHtml(movie.time)}</span>
        ${movie.dkf ? '<span class="badge dkf-badge">DKF</span>' : ""}
        ${movie.ticket ? `<span class="badge ticket">Bilet: ${escapeHtml(movie.ticket)}</span>` : ""}
        ${ageBadge}
      </div>
      <h3>${escapeHtml(movie.title)}</h3>
      <div class="meta">${meta}</div>
      <div class="info">
        ${movie.year !== "—" ? `<p><strong>Rok produkcji:</strong> ${escapeHtml(movie.year)}</p>` : ""}
        ${movie.type ? `<p><strong>Rodzaj:</strong> ${escapeHtml(movie.type)}</p>` : ""}
        ${movie.director && movie.director !== "—" ? `<p><strong>Reżyseria:</strong> ${escapeHtml(movie.director)}</p>` : ""}
        ${movie.cast ? `<p><strong>Obsada:</strong> ${escapeHtml(movie.cast)}</p>` : ""}
        ${movie.distributor ? `<p><strong>Dystrybutor:</strong> ${escapeHtml(movie.distributor)}</p>` : ""}
      </div>
    </div>`;
  return card;
}

function dayName(dateStr){
  const [day,month,year] = dateStr.split(".").map(Number);
  return new Date(year,month-1,day).toLocaleDateString("pl-PL",{
    weekday:"long",day:"numeric",month:"long",year:"numeric"
  });
}

function formatAge(age){
  const value = String(age);
  return value.includes("+") ? value : `${value}+`;
}

function ageClass(age){
  const value = String(age).replace("+","");
  if(["7","8","9"].includes(value)) return "age-family";
  if(value === "10") return "age-young";
  if(value === "13") return "age-teen";
  if(["15","16"].includes(value)) return "age-older";
  if(value === "18") return "age-adult";
  return "";
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function showMissingPoster(img){
  img.parentElement.innerHTML = '<div class="poster-missing">Brak plakatu</div>';
  reportHeight();
}

function reportHeight(){
  const height = Math.ceil(document.documentElement.scrollHeight);
  window.parent.postMessage({type:"repertuar-height",height},"*");
  try{
    if(window.frameElement) window.frameElement.style.height = `${height}px`;
  }catch(error){
    // Przy osadzeniu na innej domenie wysokość ustawia strona nadrzędna.
  }
}

new ResizeObserver(reportHeight).observe(document.getElementById("repertoire-page"));
window.addEventListener("load",reportHeight);
window.addEventListener("resize",reportHeight);
</script>
</body>
</html>
